# Local development stack. It builds the same two images production runs
# (image/app and image/caddy) but swaps in caddy/Caddyfile.dev, which uses
# `tls internal` -- no ACME, no Cloud DNS, no cloud credentials.
#
# Production does not use compose: the VM runs the quadlets in vm/quadlets/.
#
#   make dev    # reads the pinned versions from image/*.version, then
#               # http://localhost:8080 and https://localhost:8443
#
# Static IPs plus an /etc/hosts entry for `app` work around aardvark-dns keeping
# stale records between rootless `podman compose down` / `up` cycles.

name: dev-blog

networks:
  dev-blog:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.99.0/24

volumes:
  caddy-data:
  caddy-config:

services:
  app:
    build:
      context: .
      dockerfile: image/app/Dockerfile
      args:
        CADDY_VERSION: ${CADDY_VERSION:?run `make dev`, which reads image/caddy.version}
    image: localhost/dev-blog-app:dev
    container_name: dev-blog-app
    networks:
      dev-blog:
        ipv4_address: 10.89.99.10
    expose:
      - "8080"
    # Same hardening as vm/quadlets/blog.container.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    build:
      context: image/caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:?run `make dev`, which reads image/caddy.version}
        CORAZA_VERSION: ${CORAZA_VERSION:?run `make dev`, which reads image/coraza.version}
    image: localhost/dev-blog-caddy:dev
    container_name: dev-blog-caddy
    depends_on:
      - app
    networks:
      dev-blog:
        ipv4_address: 10.89.99.11
    extra_hosts:
      - "app:10.89.99.10"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    # The image runs as uid 1000; this lets it bind 80/443 inside its own
    # network namespace, as vm/quadlets/caddy.container does on the bridge.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
