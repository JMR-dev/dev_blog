name: pipeline

# One workflow, chained with `needs:`, rather than separate CI and deploy
# workflows joined by `workflow_run` (whose support on Gitea is not something to
# bet a deploy on).
#
#   changes ─┬─ build ─┐
#            ├─ unit  ─┤
#            ├─ e2e   ─┼─ preview                    (pull requests)
#            └─ infra-check
#                      └─ infra ─ images ─ rollout   (main only)
#
# On main every job runs, and each one SKIPS ITS STEPS when its part of the
# tree did not change, instead of being skipped at job level: a skipped job
# would cascade-skip everything that `needs:` it.
#
# Every job has a timeout-minutes, so a job that hangs fails instead of holding
# a runner slot for the runner's 3h default. The heavy ones allow for a heavy
# node scaling up from zero first.
#
# Runs on the GKE runners (gitea-496920/gitea-runners; see the gitea repo's
# docs/runners.md). Three labels, picked per job:
#
#   ubuntu-latest  a job pod of its own, in parallel with the others
#   heavy          a job pod alone on an e2-standard-4: compiling the Pulumi
#                  program peaks around 7.5 GB (pulumi-gcp's compute package),
#                  more than an ubuntu-latest pod's 3Gi limit
#   docker         the Docker-in-Docker runner; job pods have no Docker daemon,
#                  so `docker build` has to run here
#
# Actions are pinned to a full commit SHA, with the release in a comment: a tag
# can be moved, and these steps hold GCP_SA_KEY. Bump the SHA and the comment
# together.
#
# Jobs have no Google Cloud identity of their own; the deploy jobs
# authenticate with the GCP_SA_KEY secret, a key for
# gitea-deploy@dev-blog-494815 (created by scripts/bootstrap.sh), whose roles
# reach this one project only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly image rebuild: the only thing that picks up base-image security
  # fixes under the floating :prod tags.
  schedule:
    - cron: "0 4 * * 0"

# On a PR a newer push supersedes the run in progress: nothing there deploys.
# Anywhere else runs queue instead -- cancelling a `pulumi up` part-way leaves
# pending operations in the state, and two deploys interleaving could push an
# older image to :prod after a newer one.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT: dev-blog-494815
  GCP_ZONE: us-east1-b
  AR: us-east1-docker.pkg.dev/dev-blog-494815/blog
  VM: blog-vm
  SITE_URL: https://blog.jasonmross.dev/
  PULUMI_VERSION: "3.270.0"
  PULUMI_BACKEND: gs://dev-blog-494815-pulumi-state

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # What to DEPLOY: the site image, the edge image, the Pulumi stack.
      app: ${{ steps.diff.outputs.app }}
      caddy: ${{ steps.diff.outputs.caddy }}
      infra: ${{ steps.diff.outputs.infra }}
      # What to TEST in a browser: the site, or the tests and CI themselves.
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all() { printf 'app=true\ncaddy=true\ninfra=true\ne2e=true\n' >> "$GITHUB_OUTPUT"; echo "all parts marked changed ($1)"; }
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BEFORE" ;;
            # The weekly run only rebuilds images on fresh base layers. An
            # unattended `pulumi up` every Sunday is not what it is for.
            schedule)     printf 'app=true\ncaddy=true\ninfra=false\ne2e=false\n' >> "$GITHUB_OUTPUT"; echo "scheduled image rebuild"; exit 0 ;;
            *)            all "$EVENT"; exit 0 ;;
          esac
          # A new branch has an all-zero "before"; a force push can leave it
          # unreachable. Either way there is nothing trustworthy to diff against.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            all "no usable base"; exit 0
          fi
          files=$(git diff --name-only "$base" "$SHA")
          printf '%s\n' "$files"
          # Deploys key off SOURCE only. Test code (unit, e2e, Pulumi mock
          # tests) and CI/tooling changes are tested on the way through but
          # deploy nothing -- not even a change to this file.
          src=$(grep -vE '^src/tests/|\.(test|spec)\.[cm]?[jt]s$|_test\.go$' <<<"$files" || true)
          has() { grep -qE "$1" <<<"$2" && echo true || echo false; }
          # image/caddy.version is in app and caddy: the site image serves with the same Caddy release.
          app=$(has '^(src/|public/|package\.json$|pnpm-lock\.yaml$|astro\.config\.mjs$|tsconfig\.json$|image/app/|image/caddy\.version$)' "$src")
          {
            echo "app=$app"
            echo "caddy=$(has '^(image/caddy/|image/caddy\.version$|image/coraza\.version$)' "$src")"
            # The Pulumi program and what it uploads: infra/ (stack config,
            # secret-names.txt, go.mod) and the vm/ tree.
            echo "infra=$(has '^(infra/|vm/)' "$src")"
            # Browser tests run for site changes and for changes to the
            # browser tests or the pipeline itself.
            if [[ "$app" == true ]]; then echo "e2e=true"; else echo "e2e=$(has '^(e2e/|playwright\.config\.ts$|\.gitea/workflows/)' "$files")"; fi
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # One job for all five Playwright projects, inside the Playwright image that
  # matches the locked @playwright/test version: the browsers and their system
  # libraries are already there, so no browser is downloaded at job time (a
  # stalled browser download once hung this job for half an hour), and the
  # single runner slot pays for one checkout and install instead of five.
  # Bump the tag together with @playwright/test.
  e2e:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
    env:
      # Site, browser-test or pipeline changes. The weekly rebuild changes base
      # images, not the site, so build + unit still run and these do not.
      RUN: ${{ needs.changes.outputs.e2e }}
    steps:
      - if: env.RUN != 'true'
        run: echo "site, browser tests and pipeline unchanged -- skipping browser tests"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      # The image ships its own Node (24 as of v1.64); test on the release the
      # site is built with, from package.json like the other jobs.
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.RUN == 'true'
        run: pnpm test:e2e
      - if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra-check:
    needs: changes
    runs-on: heavy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum
      - name: Install shellcheck
        run: |
          command -v shellcheck && exit 0
          SUDO=""; [[ $(id -u) -ne 0 ]] && SUDO=sudo
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq shellcheck
      # go build + vet + the mock-runtime invariant tests; bash -n and
      # shellcheck over the VM and bootstrap scripts.
      - run: make check

  # Pull requests: show what merging would change. Same-repo PRs only -- Gitea
  # withholds secrets from forks, and this instance has no outside forks.
  preview:
    if: github.event_name == 'pull_request'
    needs: [build, unit, e2e, infra-check]
    runs-on: heavy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Install Pulumi ${{ env.PULUMI_VERSION }}
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: Load the state passphrase
        run: |
          pass=$(gcloud secrets versions access latest --secret=pulumi-config-passphrase --project="$GCP_PROJECT")
          echo "::add-mask::$pass"
          echo "PULUMI_CONFIG_PASSPHRASE=$pass" >> "$GITHUB_ENV"
      - name: pulumi preview
        working-directory: infra
        run: |
          go build -o blog-infra .
          pulumi login "$PULUMI_BACKEND"
          pulumi stack select prod
          pulumi preview --diff --non-interactive

  infra:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [changes, build, unit, e2e, infra-check]
    runs-on: heavy
    timeout-minutes: 60
    env:
      RUN: ${{ needs.changes.outputs.infra }}
    steps:
      - if: env.RUN != 'true'
        run: echo "infra/ and vm/ unchanged -- skipping pulumi up"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum
      - if: env.RUN == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: env.RUN == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: env.RUN == 'true'
        name: Install Pulumi ${{ env.PULUMI_VERSION }}
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "$PULUMI_VERSION"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - if: env.RUN == 'true'
        name: Load the state passphrase
        run: |
          pass=$(gcloud secrets versions access latest --secret=pulumi-config-passphrase --project="$GCP_PROJECT")
          echo "::add-mask::$pass"
          echo "PULUMI_CONFIG_PASSPHRASE=$pass" >> "$GITHUB_ENV"
      - if: env.RUN == 'true'
        name: pulumi up
        working-directory: infra
        run: |
          go build -o blog-infra .
          pulumi login "$PULUMI_BACKEND"
          pulumi stack select prod
          pulumi up --yes --diff --non-interactive
      - if: env.RUN == 'true'
        name: Install an SSH client for IAP
        run: |
          command -v ssh && exit 0
          SUDO=""; [[ $(id -u) -ne 0 ]] && SUDO=sudo
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends openssh-client
      # pulumi up uploads vm/ to the bucket; the VM only re-reads it on boot or
      # on a sync. On the very first deploy the VM is still bootstrapping (and
      # pulls the same files itself), so a sync that cannot connect yet is not
      # a failure.
      - if: env.RUN == 'true'
        name: Sync VM configuration
        run: |
          for i in $(seq 1 10); do
            if gcloud compute ssh "$VM" --zone="$GCP_ZONE" --project="$GCP_PROJECT" \
                 --tunnel-through-iap --quiet \
                 --command 'sudo systemctl start blog-config-sync.service && sudo journalctl -u blog-config-sync -n 40 --no-pager'; then
              exit 0
            fi
            echo "config sync attempt $i/10 failed; retrying in 30s"
            sleep 30
          done
          echo "::warning::config sync never succeeded -- a first boot applies the uploaded config itself; otherwise run 'make sync'"

  images:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [changes, infra]
    runs-on: docker
    timeout-minutes: 60
    env:
      APP: ${{ needs.changes.outputs.app }}
      CADDY: ${{ needs.changes.outputs.caddy }}
      DOCKER_BUILDKIT: "1"
    steps:
      - if: env.APP != 'true' && env.CADDY != 'true'
        run: echo "images unchanged -- nothing to build"
      - if: env.APP == 'true' || env.CADDY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.APP == 'true' || env.CADDY == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: env.APP == 'true' || env.CADDY == 'true'
        name: Log in to Artifact Registry
        run: docker login -u _json_key --password-stdin "https://${AR%%/*}" < "$GOOGLE_APPLICATION_CREDENTIALS"
      - if: env.APP == 'true' || env.CADDY == 'true'
        name: Read pinned versions
        run: |
          {
            echo "CADDY_VERSION=$(tr -d '[:space:]' < image/caddy.version)"
            echo "CORAZA_VERSION=$(tr -d '[:space:]' < image/coraza.version)"
            echo "SHORT_SHA=${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"
      - if: env.APP == 'true'
        name: Build and push the site image
        run: |
          docker build -f image/app/Dockerfile \
            --build-arg "CADDY_VERSION=$CADDY_VERSION" \
            --tag "$AR/blog:prod" --tag "$AR/blog:$SHORT_SHA" .
          # Run it the way vm/quadlets/blog.container does before it can
          # become :prod. A local podman build once hid a permissions bug
          # that only BuildKit produced, and the first deploy has no
          # previous image for auto-update to roll back to.
          docker run -d --name smoke --read-only --tmpfs /tmp:rw,size=16m,mode=1777 \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges "$AR/blog:prod"
          ok=""
          for _ in $(seq 1 15); do
            if docker exec smoke curl -fsS -o /dev/null http://127.0.0.1:8080/; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke 2>&1 | tail -5
          docker rm -f smoke >/dev/null
          [[ -n "$ok" ]] || { echo "site image did not serve / as uid 1000 on a read-only root" >&2; exit 1; }
          docker push --all-tags "$AR/blog"
          # Rollback targets: re-point :prod at one of these (docs/runbook.md).
          docker image inspect "$AR/blog:prod" --format '{{index .RepoDigests 0}}'
      - if: env.CADDY == 'true'
        name: Build and push the edge Caddy image
        run: |
          # The Dockerfile asserts the googleclouddns and Coraza modules are
          # present, so a dropped plugin fails here, not at request time.
          docker build image/caddy \
            --build-arg "CADDY_VERSION=$CADDY_VERSION" \
            --build-arg "CORAZA_VERSION=$CORAZA_VERSION" \
            --tag "$AR/caddy:prod" --tag "$AR/caddy:$SHORT_SHA" --tag "$AR/caddy:$CADDY_VERSION"
          docker push --all-tags "$AR/caddy"
          docker image inspect "$AR/caddy:prod" --format '{{index .RepoDigests 0}}'

  rollout:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [changes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KICK: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.caddy == 'true' }}
    steps:
      # Checkout first: it empties the workspace, which is where auth writes
      # the credentials file gcloud reads.
      - if: env.KICK == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.KICK == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: env.KICK == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: env.KICK == 'true'
        name: Install an SSH client for IAP
        run: |
          command -v ssh && exit 0
          SUDO=""; [[ $(id -u) -ne 0 ]] && SUDO=sudo
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends openssh-client
      # The quadlets track :prod with AutoUpdate=registry, so the VM's own
      # auto-update timer would pick the new images up eventually; this makes
      # it immediate. A failed start rolls back by itself (Notify=healthy).
      - if: env.KICK == 'true'
        name: Pull the new images on the VM
        run: |
          for i in $(seq 1 10); do
            if gcloud compute ssh "$VM" --zone="$GCP_ZONE" --project="$GCP_PROJECT" \
                 --tunnel-through-iap --quiet \
                 --command 'sudo bash -s' < scripts/vm-rollout.sh; then
              exit 0
            fi
            echo "rollout attempt $i/10 failed; retrying in 30s"
            sleep 30
          done
          echo "::warning::could not reach the VM to trigger auto-update; relying on the health gate below"
      # A pipeline that pushes a broken site and reports success is worse than
      # a failed one. Generous on purpose: a first deploy includes the VM's
      # package install, the first image pull, and ACME DNS-01 issuance.
      - name: Health gate
        run: |
          for i in $(seq 1 120); do
            if curl -fsS --max-time 10 -o /dev/null "$SITE_URL"; then
              echo "$SITE_URL answered after $i attempt(s)"
              exit 0
            fi
            echo "waiting for $SITE_URL ($i/120)"
            sleep 10
          done
          echo "$SITE_URL never answered -- check 'make status' and 'make logs'" >&2
          exit 1
