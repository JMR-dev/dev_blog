# Installed by vm/bootstrap.sh (setup_journald) as
# /etc/systemd/journald.conf.d/50-blog.conf.
#
# Persistent: Alloy (vm/quadlets/alloy.container) reads /var/log/journal, and
# its cursor has to survive a reboot. Capped well under the 20 GB boot disk;
# the journal is not the archive, watchtower is.
[Journal]
Storage=persistent
SystemMaxUse=500M
